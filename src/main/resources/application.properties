spring.application.name=pawlife-backend
server.port=3000

# Live MySQL Database (Connects Spring Boot directly to MySQL Workbench)
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/paw_life?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&sessionVariables=sql_mode='PIPES_AS_CONCAT'
spring.datasource.username=root
spring.datasource.password=nethula@2005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# SQLite Fallback (Uncomment if MySQL service is not running)
# spring.datasource.url=jdbc:sqlite:database/pawlife.db
# spring.datasource.driver-class-name=org.sqlite.JDBC

# Static resources - prioritize live public/ directory with zero caching
spring.web.resources.static-locations=file:./public/,classpath:/static/
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
